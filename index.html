 <!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RULETA ITALIKA 150CC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>🎡 RULETA ITALIKA 150CC</h1>

        <div class="contenido">

            <!-- PANEL DE ENTRADAS -->
            <div class="panel">

                <h2>Sorteo</h2>
                <p>Ruleta del 1 al 500</p>




               
            </div>


            <!-- RULETA -->
            <div class="zona-ruleta">

                <div class="ruleta-container">

                    <div class="flecha"></div>

                    <div class="ruleta" id="ruleta">
                        <div class="centro">🎯</div>
                    </div>

                </div>

                <button id="girar">
                    GIRAR
                </button>

                <p id="resultado">
                    Agrega participantes y gira la ruleta
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
